화면:
  식별자: usage.widget
  제목: Codex와 Claude 사용량 위젯
  상태: implemented

목적: |
  272 × 64의 기존 창 크기를 늘리지 않고 지금 쓸 수 있는 잔여 비율을 즉시 읽는다.
  공급자명은 메인 표면에서 제거하고, 좌우 위치와 파랑·주황 진행 막대로만 Codex와 Claude Fable을 구분한다.
  상세한 제한 종류와 초기화 일정은 마우스 오버 툴팁으로 옮긴다.

화면상태:
  - "dual: Codex와 Claude Fable을 모두 읽었을 때 좌우 1:1로 흰색 숫자 두 개와 파랑·주황 막대를 표시"
  - "codex_only: Claude 표시가 꺼졌거나 Claude Fable을 읽지 못했을 때 Codex 숫자와 파랑 막대가 전체 폭을 사용"
  - "claude_only: Codex를 읽지 못하고 Claude Fable만 읽었을 때 Claude 숫자와 주황 막대가 전체 폭을 사용"
  - "loading: 아직 결과가 없는 활성 공급자 자리에는 숫자 대신 줄임표를 표시"
  - "failed: 두 공급자 모두 읽지 못했을 때 전체 폭에 대시 하나를 표시하고 툴팁에 각 실패 이유를 제공"

배치:
  - "중앙 상단에 수치: 공급자명이나 단위를 붙이지 않은 흰색 잔여 퍼센트"
  - "각 수치 아래에 진행 막대: Codex는 기존 파랑, Claude Fable은 테라코타 주황"
  - "dual 상태 중앙에 구분선: 두 수치가 별개임을 알리는 저대비 1px 세로선"
  - "창 전체에 hover 상세: Codex 주간 및 Claude 5시간·주간·Fable의 남은 비율과 초기화 시각"
  - "우클릭 메뉴에 Claude 사용량 표시 체크 항목: 켜면 dual 후보, 끄면 codex_only"

배치힌트:
  유형: split
  방향: horizontal
  비율: "1fr:1fr 또는 사용 가능한 단일 공급자 1fr"

흐름:
  트랜지션:
    - "마우스 오버 → 공급자명이 포함된 상세 툴팁 표시"
    - "우클릭 → 컨텍스트 메뉴 표시"
    - "Claude 사용량 표시 끄기 → Claude 조회 중단, Codex가 전체 폭 사용, 설정 저장"
    - "Claude 사용량 표시 켜기 → Claude 즉시 조회, 성공하면 좌우 2분할, 설정 저장"
    - "한 공급자 조회 실패 → 실패 패널 제거, 성공한 공급자가 전체 폭 사용"
    - "더블클릭 또는 새로고침 → 활성 공급자만 다시 조회"

검증:
  - "100% 배율에서 창 외곽은 272 × 64를 유지한다."
  - "메인 표면에는 CODEX, CLAUDE, FABLE 등 공급자명이 보이지 않는다."
  - "표시되는 퍼센트 숫자는 모두 흰색이고, 공급자 구분은 진행 막대 색으로만 한다."
  - "한 공급자 실패 시 빈 절반이나 오류 약어를 남기지 않고 다른 공급자가 전체 폭을 사용한다."
  - "Claude 표시를 끄면 네트워크 조회도 멈추며 재시작 후에도 꺼진 상태를 유지한다."
  - "툴팁에는 활성 공급자의 남은 비율과 초기화 시각이 표시된다."

메모:
  - "[확정] 기존 272 × 64 창 크기를 유지한다."
  - "[확정] 숫자는 흰색으로 표시하고 메인 표면에 공급자명을 쓰지 않는다."
  - "[확정] Codex는 파랑, Claude는 주황으로 구분한다."
  - "[확정] 한 공급자 사용량을 가져올 수 없으면 성공한 하나만 표시한다."
  - "[확정] 우클릭 메뉴에서 Claude 표시를 켜고 끌 수 있다."
  - "[개발] Claude가 켜진 경우 메인 수치는 모델 범위 Fable 주간 제한의 남은 비율이다."
  - "[미정:defaulted owner=사용자] 두 공급자 모두 실패하면 전체 폭 대시 하나를 기본으로 쓰고, 실패 원인은 툴팁에만 둔다."
