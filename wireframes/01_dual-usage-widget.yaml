화면:
  식별자: usage.widget
  제목: Codex와 Claude 사용량 위젯
  상태: implemented

목적: |
  272 × 64의 기존 창 크기를 늘리지 않고 지금 쓸 수 있는 잔여 비율을 즉시 읽는다.
  공급자명은 메인 표면에 쓰지 않고, 좌우 위치와 파랑·주황 고리로만 Codex와 Claude를 구분한다.
  상세한 제한 종류와 초기화 일정은 마우스 오버 툴팁에 둔다.

화면상태:
  - "dual: Codex와 Claude가 모두 켜졌을 때 고리 게이지와 숫자 한 쌍씩을 좌우로 표시"
  - "codex_only: Claude 표시가 꺼졌을 때 Codex 한 쌍이 가운데에 놓임"
  - "missing: 값을 읽지 못한 공급자는 자리를 지키고 빈 고리와 대시를 표시(실패 이유는 툴팁)"
  - "loading: 아직 결과가 없고 조회 중인 공급자는 빈 고리와 줄임표를 표시"
  - "stale: 일시 실패 동안 유지한 이전 값은 고리와 숫자를 흐리게 표시"
  - "docked: 작업 표시줄 안에 놓이면 바탕 없이 고리와 숫자만, 표시줄의 밝고 어두움을 따름"
  - "floating: 그 밖의 자리에서는 어두운 바탕 위에 표시해 어떤 화면 위에서도 읽힘"

배치:
  - "공급자마다 고리 게이지: 12시에서 시계 방향으로 잔여 비율만큼 채움. Codex는 파랑, Claude는 테라코타 주황"
  - "고리 오른쪽에 수치: 잔여 퍼센트 숫자와 작고 옅은 퍼센트 기호"
  - "두 쌍은 창 가운데에 모아 놓고, 자릿수가 같은 값이 바뀌어도 자리가 움직이지 않음"
  - "창 전체에 hover 상세: Codex 주간 및 Claude 5시간·주간·Fable의 남은 비율과 초기화 시각"
  - "우클릭 메뉴에 Claude 사용량 표시 체크 항목: 켜면 dual, 끄면 codex_only"

배치힌트:
  유형: split
  방향: horizontal
  비율: "고리+숫자 한 쌍씩, 가운데 정렬"

흐름:
  트랜지션:
    - "마우스 오버 → 공급자명이 포함된 상세 툴팁 표시. 작업 표시줄 안에서는 옅은 판이 켜짐"
    - "우클릭 → 컨텍스트 메뉴 표시"
    - "드래그 → 이동. 작업 표시줄 안에 놓으면 표시줄 가운데 줄에 맞춰 앉음"
    - "Claude 사용량 표시 끄기 → Claude 조회 중단, Codex 한 쌍이 가운데로, 설정 저장"
    - "Claude 사용량 표시 켜기 → Claude 즉시 조회, 좌우 두 쌍, 설정 저장"
    - "더블클릭 또는 새로고침 → 활성 공급자만 다시 조회"

검증:
  - "창 외곽은 화면 배율과 무관하게 272 × 64 픽셀을 유지한다."
  - "메인 표면에는 CODEX, CLAUDE, FABLE 등 공급자명이 보이지 않는다."
  - "어두운 바탕과 어두운 작업 표시줄에서 숫자는 흰색, 밝은 작업 표시줄에서는 짙은 색이다."
  - "공급자 구분은 좌우 위치와 고리 색으로만 한다."
  - "값을 읽지 못한 공급자의 자리는 비우지 않고 빈 고리와 대시를 둔다."
  - "Claude 표시를 끄면 네트워크 조회도 멈추며 재시작 후에도 꺼진 상태를 유지한다."
  - "툴팁에는 활성 공급자의 남은 비율과 초기화 시각이 표시된다."

메모:
  - "[확정] 기존 272 × 64 창 크기를 유지한다."
  - "[확정] 메인 표면에 공급자명을 쓰지 않는다. 어두운 바탕의 숫자는 흰색이다."
  - "[확정] Codex는 파랑, Claude는 주황으로 구분한다."
  - "[확정] 우클릭 메뉴에서 Claude 표시를 켜고 끌 수 있다."
  - "[개발] 켜 둔 Claude 절반은 값이 없거나 실패해도 자리를 지킨다(AGENTS.md)."
  - "[확정 2026-11-14] 막대 대신 고리 게이지, 작업 표시줄 안에서는 바탕 없이 표시. 사용자가 설치본을 써 보고 확정했다. 비교한 안과 근거는 docs/design/2026-11-14/README.md."
