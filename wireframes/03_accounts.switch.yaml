화면:
  식별자: accounts.switch
  제목: 계정 전환 준비
  상태: draft
목적: |
  어떤 계정에서 어떤 계정으로 바뀌는지와 전환에 필요한 조건을 확인한다.
  현재 작업을 마친 사용자가 앱을 직접 닫은 뒤 명시적으로 전환하도록 돕는다.
화면상태:
  - "waiting: Codex 또는 관련 엔진 실행 중. 전환 비활성, 앱과 터미널을 닫으라는 구체적 안내."
  - "ready: writer가 종료되어 전환 버튼 사용 가능."
  - "applying: 확인 뒤 대화상자가 닫히고 관리창에 적용 진행 표시."
배치:
  - "상단에 전환 제목과 출발 계정 → 도착 계정 이름."
  - "중앙에 작업 저장 후 Codex 앱과 터미널을 닫으라는 안내. 프로그램을 강제 종료하지 않음."
  - "조건 상태: 실행 중 또는 전환 준비 완료를 문장으로 표시. 자동 검사로 상태만 갱신하고 포커스 이동 없음."
  - "하단에 취소와 전환하고 Codex 열기. 준비 전 주요 버튼 비활성."
흐름:
  트랜지션:
    - "대화상자 진입 → 위젯 조회 helper 중지 후 writer 존재 검사."
    - "사용자가 Codex와 CLI 종료 → 준비 완료 표시 → 전환 버튼 활성."
    - "취소/Escape → 인증 수정 없이 관리창 복귀 및 조회 재개."
    - "전환하고 Codex 열기 → 쓰기 직전 조건 재검사 → journal을 통한 적용 → 앱 실행 시도."
    - "앱 실행만 실패 → 계정은 적용되었음을 표시하고 시작 메뉴로 실행 안내."
검증:
  - "도착 계정이 명확하며 현재 계정으로 중복 전환하지 않는다."
  - "writer가 실행 중이면 버튼과 실제 적용 경로 모두 전환을 막는다."
  - "1초 상태 검사 동안 이름 편집/다른 창의 포커스가 변하지 않는다."
  - "취소는 인증 파일을 바꾸지 않고 대기 상태를 해제한다."
메모:
  - "[확정] 자동 한도 전환과 임의 강제 종료는 사용하지 않는다."
  - "[미정:defaulted owner=사용자] 별도 준비 대화상자로 작업 종료 조건을 설명하는 구현 후보다."
