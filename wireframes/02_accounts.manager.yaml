화면:
  식별자: accounts.manager
  제목: Codex 계정 관리
  상태: draft
목적: |
  사용자가 계정의 이름과 현재 사용 여부를 쉽게 구분하고, 필요할 때 직접 전환한다.
  계정 선택을 중심으로 정보와 행동을 모아 이름 변경, 추가 로그인, 전환이 서로 섞이지 않게 한다.
화면상태:
  - "empty: 등록 설명과 현재 계정 등록 버튼을 중심에 표시. 다른 계정 추가는 첫 등록 이후 사용 가능."
  - "selected_active: 현재 사용 중 표시, 주간 잔여와 확인 시각, 이름 변경. 전환 버튼은 현재 사용 중으로 비활성."
  - "selected_saved: 저장된 계정의 마지막 사용량과 확인 시각, 이름 변경, 이 계정으로 전환, 저장된 로그인 삭제."
  - "unregistered_current: 저장 목록이 있어도 현재 로그인 미등록 안내와 현재 계정 등록을 제공. 등록 전 전환은 비활성."
  - "busy: 상단 진행 안내와 표시를 유지하고 중복 실행 차단. OAuth 중에는 로그인 취소를 제공."
  - "failed: 상단 오류 안내를 유지하고 기존 계정 목록과 안전한 재시도 경로를 보존."
  - "recovery: 사용량 조회와 신규 변경을 막고 상단 미완료 전환 복구를 제공."
배치:
  - "상단 헤더: Codex 계정, 한 줄 설명, 우측 다른 계정 추가 버튼."
  - "헤더 아래 안내 띠: 준비·로그인 대기·완료·오류를 아이콘/문장/색으로 구분. 오류가 창 아래에 묻히지 않음."
  - "왼쪽 목록: 저장된 계정 수와 새로고침, 계정별 이름·마스킹된 식별 힌트·현재 사용 중 표시. 선택 상태는 명확한 강조."
  - "오른쪽 상세: 선택 계정 이름과 이름 변경 버튼, 현재/저장됨 표시, 식별 힌트."
  - "상세 중앙 사용량: 주간 잔여 수치와 막대, 마지막 확인 시각과 초기화 예정. 미확인은 미확인으로 표시."
  - "상세 하단 행동: 주요 전환 버튼, 사용 중 앱을 닫아야 한다는 조건. 삭제는 별도 조용한 보조 행동."
  - "빈 목록일 때 상세: 현재 계정을 등록하면 시작할 수 있다는 짧은 설명과 현재 계정 등록 버튼. 이름은 기본값으로 부여하며 나중에 변경."
배치힌트:
  유형: split
  방향: horizontal
  비율: "계정 목록 30%, 상세와 행동 70%"
  작은창: "작업영역에 맞춰 창 크기를 제한하고 상세 영역을 세로 스크롤. 목록과 전역 행동은 유지."
흐름:
  트랜지션:
    - "현재 계정 등록 → 기본 이름으로 등록 → 해당 계정을 선택하고 완료 안내."
    - "계정 목록 선택 → 상세와 가능한 행동 갱신. 자동 전환 없음."
    - "이름 변경 또는 F2 → 현재 이름이 선택된 편집 대화상자 → 저장 시 즉시 목록/상세 반영, 취소 시 원문 유지."
    - "다른 계정 추가 → 선택적인 이름 입력과 브라우저 로그인 설명 → 공식 로그인 → 성공 시 새 계정 선택, 취소 시 현재 계정 유지."
    - "이 계정으로 전환 → accounts.switch 준비 대화상자 → 적용 및 앱 실행 결과."
    - "삭제 → 계정 이름이 들어간 확인 → 비활성 저장 항목만 삭제. 현재 계정은 삭제 불가."
    - "미완료 전환 복구 → writer 종료 확인 → 실제 현재 인증을 보존하며 복구 → 완료 또는 명시적 오류."
검증:
  - "별칭을 입력하지 않아도 첫 등록 버튼 클릭으로 계정이 나타난다."
  - "현재 계정과 비활성 계정 모두 이름을 수정할 수 있고 다시 열어도 반영된다."
  - "이름 편집 중 1초 타이머가 포커스나 선택한 텍스트를 빼앗지 않는다."
  - "등록·이름 변경·취소·실패 후 준비 중이라는 문구가 남지 않는다."
  - "저장된 계정의 사용량에는 마지막 확인 시각이 있고 자동 갱신된 값으로 오인시키지 않는다."
  - "초기화 시점이 지난 사용량은 갱신 필요로 표시한다."
  - "최소 창 크기와 Windows 배율에서 버튼이 잘리지 않으며 작은 창의 상세 하단은 스크롤로 접근한다."
  - "Codex에서 직접 미등록 계정으로 로그인한 경우에도 현재 계정 등록으로 진행할 수 있다."
  - "빈 이름, 긴 이름, 제어 문자 오류와 Enter/Escape가 의도대로 작동한다."
메모:
  - "[확정] 사용자는 수동 전환, 기존 위젯 통합, 이름 변경을 포함한 편의성 UX/UI 개선을 요청했다."
  - "[미정:defaulted owner=사용자] 한 화면의 목록/상세와 어두운 중립색을 이번 구현 후보로 선택했다. 사용자 구조 확인 전 agent sketch다."
  - "[개발] 실제 WinForms 화면과 합성 데이터 프리뷰를 이 YAML의 파생 시각 표면으로 사용한다."
  - "[개발] 인증 엔진·DPAPI·공식 로그인·수동 writer 종료 검사는 유지한다. 이름 변경은 metadata-only다."
  - "[미정:downstream owner=사용자] 실제 두 번째 계정 로그인과 A→B→A 전환 수용 검증이 남는다."
변경기록:
  - 일자: 2026-09-09
    출처: "사용자가 버튼 나열과 별칭/포커스 문제를 지적하며 wireframe 기반 UX/UI 재설계를 요청함."
    사유: "전역 입력란과 같은 수준의 버튼 나열을 기각하고 선택 계정 중심의 정보·행동 구조로 재구성."
